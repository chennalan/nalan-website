<text x="100" y="125" font-family="Georgia,serif" font-size="22" letter-spacing="7" fill="#fff0dc">A NOTE TO MYSELF</text>
<text x="100" y="230" font-family="serif" font-size="66" fill="#fff7e9">还没有开始</text><text x="100" y="315" font-family="serif" font-size="66" fill="#fff7e9">就定义自己了吗</text>
<path d="M103 344h205" stroke="#fff0dc" stroke-width="2"/>
<text x="103" y="392" font-family="serif" font-size="24" fill="#fff0dc">我们总在真正开始之前，</text><text x="103" y="432" font-family="serif" font-size="24" fill="#fff0dc">就给自己贴上各种标签。</text><text x="103" y="472" font-family="serif" font-size="24" fill="#fff0dc">可人生的可能性，不该被预设的答案提前封死。</text>
<text x="103" y="560" font-family="serif" font-size="22" fill="#fff0dc">不是你不够好，而是你还没开始。</text>
