<text x="150" y="525" fill="#e4d5c7" font-size="27" font-family="serif">也会祈求命运高抬贵手。</text>
<text x="150" y="605" fill="#cbb9a8" font-size="19" font-family="serif" letter-spacing="5">纳兰的个人小站 · 随笔</text>
<rect width="1600" height="900" fill="#111b27" opacity=".08"/>
