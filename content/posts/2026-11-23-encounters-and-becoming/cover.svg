<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="薄雾中的湖泊、日出与渐行渐远的两个人">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e7d9cf"/><stop offset=".55" stop-color="#f6d9bd"/><stop offset="1" stop-color="#b6c5c4"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#a9b8b5"/><stop offset=".55" stop-color="#839b9b"/><stop offset="1" stop-color="#344c52"/></linearGradient>
 <linearGradient id="sun" x2="0" y2="1"><stop stop-color="#fff1cf"/><stop offset="1" stop-color="#e8ae75"/></linearGradient>
 <linearGradient id="mist" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".72"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <linearGradient id="shade" x2="0" y2="1"><stop stop-color="#172b31" stop-opacity="0"/><stop offset="1" stop-color="#172b31" stop-opacity=".58"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="660" cy="242" r="52" fill="#ffe8c5" opacity=".55" filter="url(#blur)"/>
<circle cx="660" cy="242" r="25" fill="url(#sun)"/>
<path d="M0 300 Q170 205 330 275 T650 280 T980 230 T1200 260 V420 H0Z" fill="#89999a" opacity=".38"/>
