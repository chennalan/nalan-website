<path d="M996 520 L994 547 M1018 520 L1021 547" stroke="#29383b" stroke-width="8" stroke-linecap="round"/>
<!-- reeds -->
<g stroke="#4e625d" stroke-width="4" fill="none" opacity=".7"><path d="M0 675 Q35 565 20 500 M24 675 Q68 570 72 520 M48 675 Q100 590 115 540 M1140 675 Q1110 565 1135 500 M1170 675 Q1155 590 1187 540"/></g>
<rect width="1200" height="675" fill="url(#shade)"/>
<text x="72" y="78" fill="#fffaf2" font-family="Georgia,serif" font-size="18" letter-spacing="5" opacity=".9">NOTES ON MEETING &amp; PARTING</text>
<text x="72" y="540" fill="#fffaf2" font-family="serif" font-size="43" letter-spacing="2">相遇，是为了遇见更完整的自己</text>
<text x="76" y="578" fill="#f3e8dc" font-family="sans-serif" font-size="17" letter-spacing="4">在别人的眼睛里，看见未曾认识的自己</text>
</svg>