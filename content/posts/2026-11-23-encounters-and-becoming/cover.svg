<ellipse cx="325" cy="574" rx="35" ry="8" fill="#1c3035" opacity=".3"/>
<path d="M309 420 Q286 437 286 486 L280 555 Q299 570 340 557 L341 486 Q343 442 329 420Z" fill="#d9d0c4"/>
<path d="M306 420 Q300 397 313 384 Q333 378 341 399 L337 428Z" fill="#2d2928"/>
