<ellipse cx="530" cy="390" rx="520" ry="34" fill="#fff" opacity=".3" filter="url(#blur)"/>
<ellipse cx="870" cy="360" rx="420" ry="28" fill="#fff" opacity=".34" filter="url(#blur)"/>
