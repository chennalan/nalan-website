<text x="105" y="145" font-family="Georgia,serif" font-size="22" letter-spacing="8" fill="#fff0d8">NOTES ON TRAVEL</text>
<text x="105" y="245" font-family="serif" font-size="62" fill="#fff7e9">有时候，我们只是想离开</text><text x="105" y="325" font-family="serif" font-size="62" fill="#fff7e9">现在的地方</text>
<path d="M108 355h190" stroke="#fff0d8" stroke-width="2"/>
<text x="108" y="400" font-family="serif" font-size="23" fill="#fff0d8">目的地其实并不重要。</text><text x="108" y="438" font-family="serif" font-size="23" fill="#fff0d8">重要的是，暂时走出此刻的世界。</text>
<text x="108" y="555" font-family="serif" font-size="19" letter-spacing="2" fill="#fff0d8">阿兰·德波顿《旅行的艺术》</text>
