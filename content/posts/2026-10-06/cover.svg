2L38 370H82L116 298Z" fill="#111719"/><path d="M145 292L165 370H210L180 292Z" fill="#111719"/></g><rect x="55" y="55" width="1015" height="1090" fill="none" stroke="#eef2f2" stroke-opacity=".28"/><text x="80" y="135" fill="#263b4b" font-family="Noto Serif SC,Songti SC,serif" font-size="56" font-weight="600">幸得诸君慰平生</text><line x1="82" y1="168" x2="205" y2="168" stroke="#263b4b" stroke-width="2"/><text x="82" y="220" fill="#334958" font-family="Noto Serif SC,Songti SC,serif" font-size="23">阴天是一种慈悲</text><text x="82" y="255" fill="#334958" font-family="Noto Serif SC,Songti SC,serif" font-size="23">让众生学会不看而见</text><text x="82" y="310" fill="#334958" font-family="Noto Serif SC,Songti SC,serif" font-size="23">外求的人，漂浮难安舍近求远</text><text x="82" y="345" fill="#334958" font-family="Noto Serif SC,Songti SC,serif" font-size="23">一生都在等待晴天</text><text x="82" y="385" fill="#52616a" font-family="Noto Serif SC,Songti SC,serif" font-size="18">——陈昂《云下指月》</text></svg>