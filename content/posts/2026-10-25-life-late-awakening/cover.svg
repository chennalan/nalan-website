<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#9eb7d0"/><stop offset=".48" stop-color="#f5c08e"/><stop offset="1" stop-color="#ed986b"/></linearGradient><linearGradient id="lake" x2="0" y2="1"><stop stop-color="#e9ad8a"/><stop offset="1" stop-color="#314c63"/></linearGradient><linearGradient id="shade" x2="0" y2="1"><stop stop-color="#182b3b" stop-opacity="0"/><stop offset="1" stop-color="#182b3b" stop-opacity=".72"/></linearGradient></defs><rect width="1200" height="675" fill="url(#sky)"/><circle cx="410" cy="395" r="65" fill="#fff0c7"/><path d="M0 420 130 330 245 385 370 300 485 390 620 330 760 405 900 325 1030 390 1200 315V675H0Z" fill="#64758a"/><path d="M0 450Q170 420 340 455T680 450T1000 455T1200 445V675H0Z" fill="url(#lake)"/><g stroke="#f8d7b3" stroke-width="3" opacity=".55"><path d="M300 500h250M240 540h350M390 580h300M260 620h420"/></g><path d="M0 0H1200V675H0Z" fill="url(#shade)"/><path d="M900 675 888 555 910 490 948 442 982 485 1015 555 1035 675Z" fill="#172a39"/><circle cx="948" cy="415" r="32" fill="#172a39"/><path d="M918 495 860 568 880 584 946 526M982 495 1042 566 1025 583 966 526" fill="#172a39"/><rect x="65" y="55" width="1070" height="565" fill="none" stroke="#fff1dd" stroke-opacity=".65" stroke-width="2"/><text x="105" y="125" font-family="Georgia,serif" font-size="22" letter-spacing="7" fill="#fff1dd">A LATE AWAKENING</text><text x="105" y="235" font-family="serif" font-size="66" fill="#fff8eb">人生全是迟来的清醒</text><path d="M108 270h210" stroke="#fff1dd" stroke-width="2"/><text x="108" y="325" font-family="serif" font-size="26" fill="#fff5e5">看清世事，却不必被世事改变得面目全非。</text><text x="108" y="370" font-family="serif" font-size="24" fill="#fff5e5">愿我们历经成长，仍然鲜活。</text><text x="108" y="560" font-family="serif" font-size="20" letter-spacing="3" fill="#fff1dd">给时间一点时间，也给自己一点宽容。</text></svg>